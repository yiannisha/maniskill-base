[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maniskill-robot-lab"
version = "0.1.0"
description = "Minimal evaluation and data-collection harness around ManiSkill."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mani_skill",
    "gymnasium",
    "numpy",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["robot_lab*"]
