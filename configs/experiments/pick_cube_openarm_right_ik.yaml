experiment:
  name: pick_cube_openarm_right_ik
  seed: 0
  output_dir: runs/pick_cube_openarm_right_ik

env:
  id: PickCubeOpenArm-v0
  num_envs: 1
  obs_mode: state_dict
  control_mode: pd_ee_delta_pos
  render_mode: human
  max_episode_steps: 120
  robot_uids: openarm_right
  kwargs: {}

policy:
  type: openarm_pick_ik

action_adapter:
  type: clip_box

observation_adapter:
  type: identity

recording:
  enabled: false
  save_video: false
  save_trajectory: false
  video_fps: 30

evaluation:
  num_episodes: 1
