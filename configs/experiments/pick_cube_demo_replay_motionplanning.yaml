experiment:
  name: pick_cube_demo_replay_motionplanning
  seed: 0
  output_dir: runs/pick_cube_demo_replay_motionplanning

env:
  id: PickCube-v1
  num_envs: 1
  obs_mode: state
  control_mode: pd_joint_pos
  render_mode: rgb_array
  max_episode_steps: 100
  robot_uids: panda
  kwargs: {}

policy:
  type: demo_replay
  params:
    env_id: PickCube-v1
    source: motionplanning
    cycle_episodes: false

action_adapter:
  type: identity

observation_adapter:
  type: identity

recording:
  enabled: true
  save_video: true
  save_trajectory: true
  video_fps: 30

evaluation:
  num_episodes: 1000

runner:
  debug_log: false
  step_pause: false
